<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundCloud Feed Default</title>
  <style>
    :root {
      --sc-orange: #ff5500;
      --sc-dark: #121212;
      --sc-card: #222222;
      --sc-text: #ffffff;
      --sc-muted: #999999;
      --sc-border: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--sc-dark);
      color: var(--sc-text);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      fill: var(--sc-orange);
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--sc-orange);
    }

    .subtitle {
      margin: 0 0 14px 0;
      font-size: 12px;
      line-height: 1.4;
      color: var(--sc-muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #4caf50;
      background: var(--sc-card);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--sc-border);
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4caf50;
      box-shadow: 0 0 6px #4caf50;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--sc-card);
      border: 1px solid var(--sc-border);
      border-radius: 6px;
      padding: 12px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .setting-label {
      font-size: 12px;
      font-weight: 500;
      user-select: none;
    }

    /* Modern toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: .2s ease-in-out;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .2s ease-in-out;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--sc-orange);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--sc-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo-icon" viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <h2>SoundCloud Cleaner</h2>
  </div>
  <p class="subtitle">Default to Feed stream & remove promoted tracks automatically.</p>

  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Active on soundcloud.com</span>
  </div>

  <div class="settings-list">
    <label class="setting-item" for="defaultToFeed">
      <span class="setting-label">Default to Feed page</span>
      <span class="switch">
        <input type="checkbox" id="defaultToFeed" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="setting-item" for="routeLogoToFeed">
      <span class="setting-label">Logo routes to Feed</span>
      <span class="switch">
        <input type="checkbox" id="routeLogoToFeed" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="setting-item" for="removePromotedTracks">
      <span class="setting-label">Remove promoted tracks</span>
      <span class="switch">
        <input type="checkbox" id="removePromotedTracks" checked>
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <div class="footer">Changes apply in real time</div>

  <script src="popup.js"></script>
</body>
</html>
