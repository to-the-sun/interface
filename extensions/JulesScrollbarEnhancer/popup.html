<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jules Scrollbar Options</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-container">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M3 3h18v18H3V3zm16 16V5h-3v14h3zM6 7l4 4H7v2h3l-4 4 1.41 1.41L13.83 13H11v-2h2.83L7.41 5.59 6 7z"/>
      </svg>
      <h2>Jules Scrollbars</h2>
    </div>
  </div>

  <div class="content">
    <div class="option-row">
      <span class="option-label">Enable Scrollbar Enhancement</span>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="option-row vertical">
      <span class="option-label">Scrollbar Size</span>
      <div class="size-buttons">
        <button class="size-btn" data-size="14px">Medium (14px)</button>
        <button class="size-btn active" data-size="18px">Big (18px)</button>
        <button class="size-btn" data-size="22px">Extra Big (22px)</button>
      </div>
    </div>

    <div class="status-msg" id="status-msg">Settings saved!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
